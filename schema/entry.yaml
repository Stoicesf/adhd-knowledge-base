# =====================================================================
# 源条目 schema 冻结契约  v1.2   (阶段六 · P0 / 阶段 B 批次 3 修订)
# ---------------------------------------------------------------------
# 每个可被 agent 消费的「源条目」是一个独立 .md 文件：
#   YAML frontmatter（本文件定义的字段）+ Markdown 正文（见 inject_text）
# 位置：02_内容包/*/*.md（含 source_id 的才是源条目；63 页 BookStack
#       正文带 frontmatter 但无 source_id，不进编译管线）
#
# 本文件是「单一事实来源」：注入通道（检索过滤）与 skill 通道（调度触发）
# 共用同一份 when/exit_when，禁止两条通道各自维护条件。
# 本契约被 03_agent编译/validators/schema_check.py 直接读取做校验。
# =====================================================================

meta:
  schema_version: 1.2
  frozen_at: 2026-11-12
  revised_at: 2026-11-13
  description: "单源条目 → 双产物（检索块 + skill spec）的字段契约"
  changelog:
    - "v1.1 (2026-11-13)：callable 增 scaffold_level(full|light)，用于 re-entry 降级支架；用户裁决 D2 走降级语义。when/exit_when 白名单与谓词语法未变。"
    - "v1.2 (2026-11-13，阶段 B 批次 3 · PROP-0004/0005)：scenario 增 parent_escalation；when.allowed_fields 与 field_enums 增 parent_affect_level=[low,mid,high]（家长火气，与孩子情绪 affect 明确区分）。注意：该维度在阶段 A 2.5b 已并入 predicate_equiv.iter_states()，本版只做声明层补齐，求值实现与状态空间维度均未改动。"

# ---------------------------------------------------------------------
# 字段定义（required=必须出现在 frontmatter）
# ---------------------------------------------------------------------
fields:

  id:
    required: true
    type: string
    pattern: "^[a-z][a-z0-9_]*$"        # snake_case，全局唯一
    note: "建议命名：<audience>_<scenario>_<n>，如 parent_redirect_drift_01"

  type:
    required: true
    type: enum
    values: [procedural, explanatory, boundary]
    note: >
      程序性支架=需 agent 改变下一步动作或调用参数（主产物 skill spec，
      inject_text 作 fallback/可调试文本）；解释性知识=只影响上下文措辞
      （主产物检索块，无 callable）；边界与安全=主产物 guardrail 规则
      （见 05_审核与运营/guardrail_rules.yaml）。

  audience:
    required: true
    type: enum
    values: [parent, child, clinician, both]

  scenario:
    required: true
    type: enum
    values: [task_initiation, attention_drift, frustration_escalation, wm_overload, transition, parent_escalation]
    note: >
      parent_escalation（PROP-0005）是**家长自身情绪急救**场景，与前五项
      「孩子作业过程」场景主体不同。运行期走
      09_家长端工具/parent_cool_clone/server/server.py 的
      handle_parent_escalation() 旁路，只调 build.retrieve +
      guardrail_node.judge，**不调 router.route()**；router.in_scope() 按
      scenario 精确收窄，保证新旧轨迹互不污染。

  exec_target:
    required: true
    type: enum
    values: [启动, 工作记忆, 抑制控制, 情绪调节, 时间感知]

  evidence_level:
    required: true
    type: enum
    values: [A, B, C]        # 沿用仓库现有分级（A=指南/试验, B=经验性策略, C=待核验）

  contraindication_flag:
    required: true
    type: enum
    values: [safe, caution, restricted]

  last_reviewed:
    required: true
    type: date               # YYYY-MM-DD

  # ---- 谓词组：注入通道与 skill 通道共用同一份 ----
  when:
    required: true
    type: object
    note: >
      极小表达式子集：字段名 + 比较运算符 + 字面量；同字段多值=OR，多字段=AND。
      ⚠ 主体区分：affect（孩子情绪，仅文档层，且不在
      predicate_equiv.iter_states() 状态空间内）与 parent_affect_level
      （家长火气，求值层）是不同主体，不得互相代替（PROP-0004 known_risk）。
      ⚠ 枚举字段必须写成列表（编译为 op=in）：_common.eval_predicate 对
      非 in 比较会执行 int(sv)，裸字符串枚举值如 "low" 会恒为假。
    allowed_fields: [task_phase, attention_state, ownership, wm_load, consecutive_failures, parent_affect_level]
    operators: [">=", "<=", ">", "<", "==", "!=", "in"]
    field_enums:
      task_phase: [启动, 理解, 计划, 执行, 检查, 微休息]
      attention_state: [on-task, drift, re-entry]
      ownership: [child-leading, parent-hinting, parent-taking-over]
      parent_affect_level: [low, mid, high]
    nested_validation_note: >
      ⚠ 已知限制（PROP-0004 自动化预检记录）：schema_check.py 只校验
      fields 下的顶层必填/枚举/格式，**不读**本节 allowed_fields 与
      field_enums。新字段的合法性由
      03_agent编译/validators/parent_escalation_tests.py 显式断言兜住，
      不能只靠改本文件就认为「字段已被校验」。

  exit_when:
    required: false
    type: object
    note: "callable 条目必须非空；否则 CI(exit_exists) 拒绝合并"
    allowed_fields: [attention_state, wm_load, consecutive_successes, ownership]
    operators: [">=", "<=", ">", "<", "==", "!="]

  inject_text:
    required: true
    type: string
    note: >
      面向用户的实际文本。长度粒度：家长端 150–250 字（情景+可说的话+不要说的话）；
      儿童端 80–150 字（微步骤指令+完成信号）；临床边界保留完整段落。

  callable:
    required: false
    type: object
    note: "仅 type=procedural 且需被调度器触发时存在"
    subfields:
      name: {required: true, type: string}
      params: {required: false, type: object}
      returns: {required: true, type: object}
      side_effect: {required: true, type: enum, values: [none, state-write, log-only]}
      scaffold_level:
        required: false
        type: enum
        values: [full, light]
        default: full
        note: "支架强度。full=正常支架；light=降级支架（re-entry 中间态只给完成信号，不补讲/不加新指令）。仅产物字段，不新增状态机字段，不改变路由三态。"

  related_ids:
    required: false
    type: list
    note: "混合条目拆两条时用，不硬塞进单 schema"

# ---------------------------------------------------------------------
# 谓词语法（供 predicate_equiv.py / build.py 解析）
# ---------------------------------------------------------------------
predicate_grammar:
  field_or: "同字段多值 → OR"
  field_and: "多字段 → AND"
  value_formats:
    enum_field: "[v1, v2, ...]   → op=in"
    int_field:  "\">=2\" / \"<1\" / \"==3\" → 比较运算符 + 整数"
  forbidden: ["嵌套布尔", "跨字段引用", "函数调用"]

# ---------------------------------------------------------------------
# 产物归属（冻结，不允许逐条商量）
# ---------------------------------------------------------------------
product_attribution:
  procedural:    {primary: skill_spec,   secondary: inject_text_as_fallback}
  explanatory:   {primary: retrieval_chunk, secondary: none}
  boundary:      {primary: guardrail_rule, secondary: retrieval_chunk_for_explain}
