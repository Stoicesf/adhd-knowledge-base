# 页面 metadata schema v1
# 阶段一（metadata 层）· 08_AI语料层
schema_version: v1
schema_date: 2026-11-11
layer: 阶段一 metadata 层
source_status_table: 05_审核与运营/页面清单状态表.csv
source_content_root: 02_内容包/

remarks:
  - 原方案文字写"15 列"，逐项数实为 16 个字段，本层按 16 列落盘。
  - >-
    状态表"页型"列原值为渠道标签（首页 / C端-书籍A / C端-书籍B / B端-书籍C / 临床-书籍D），
    与本层语义页型枚举不是同一口径；本层"页型"按《05_审核与运营/案例页模板页_PEMAT评分口径.md》
    §0 / §4bis / §4ter 的识别规则从正文判定，渠道标签仅作交叉校验；两者矛盾记入差异清单。
  - >-
    本层 metadata 不含字数（甲'）列；正文若被后续环节引用字数，必须写明口径
    （naive 口径 = 全汉字 − YAML 内汉字；统一口径 = 再去 URL 内汉字）。
  - 2026-11-11 裁决后扩为 18 列：原 16 列 + 面向_次位 + 关联依据；面向枚举补 全部，年龄段枚举补 未标注。

field_count: 18
field_order:
  - 编号
  - 页题
  - 所属书
  - 面向
  - 页型
  - 证据状态
  - 年龄段
  - 场景
  - 适用条件
  - 不适用条件
  - 核心动作数
  - 含可照念话术
  - 含反例
  - 关联页
  - 高风险标记
  - 最后审核
  - 面向_次位
  - 关联依据

field_groups:
  转录类: [编号, 页题, 所属书, 面向, 面向_次位, 页型, 证据状态, 最后审核]
  抽取类: [年龄段, 场景, 适用条件, 不适用条件]
  派生类: [核心动作数, 含可照念话术, 含反例, 关联页, 关联依据]
  高风险判定: [高风险标记]

transcription_rule: >-
  转录类字段直接取自状态表对应列（面向←目标用户、所属书←所属书籍），是转录不是重新判定；
  若与正文矛盾，以状态表为准，并把矛盾记入 metadata补标说明.md 的差异记录。

fields:
  - name: 编号
    type: string
    required: true
    group: 转录类
    source_column: 编号
    multi: false
    enum: null
    description: 页面唯一编号，形如 A03 / B30 / C01 / D01；原样转录，不改写大小写与前缀。
  - name: 页题
    type: string
    required: true
    group: 转录类
    source_column: 页题
    multi: false
    enum: null
    description: 页面标题，原样转录状态表"页题"列；全角冒号、引号保留原文。
  - name: 所属书
    type: string
    required: true
    group: 转录类
    source_column: 所属书籍
    multi: false
    enum: null
    description: 所属书籍目录名，取值为 书籍A_公开知识库 / 书籍B_家庭工具与情景案例 / 书籍C_B端工作手册 / 书籍D_临床边界参考。
  - name: 面向
    type: enum
    required: true
    group: 转录类
    source_column: 目标用户
    multi: false
    enum_ref: 面向
    mapping:
      本人: 本人
      父母: 父母
      伴侣: 伴侣
      教师: 教师
      专业人员: B端
      临床审核: 临床
      全部: 全部
    description: >-
      单选。状态表双端写法（如"父母 / 教师"）取首位落入单选枚举，次位写入 面向_次位 列；
      状态表"全部"映射为本枚举 全部（面向所有读者，用于全库入口 / 边界声明页）。
  - name: 页型
    type: enum
    required: true
    group: 转录类
    source_column: 页型（渠道标签，仅作交叉校验）
    multi: false
    enum_ref: 页型
    description: >-
      单选。按正文标记识别，规则见 enum.页型；状态表渠道标签与判定结果矛盾时记入差异清单，不回改正文。
  - name: 证据状态
    type: string
    required: true
    group: 转录类
    source_column: 证据状态
    multi: false
    allowed_values: [强证据, 有条件推荐, 经验性策略, 虚构教学案例, "—"]
    description: 原样转录状态表"证据状态"列；A00 首页为 "—"。
  - name: 年龄段
    type: enum
    required: true
    group: 抽取类
    multi: true
    enum_ref: 年龄段
    description: 从正文实查抽取；依据正文出现的学段表述与场景判定；跨两档及以上写 跨年龄；正文未给学段信息属信息缺失，写 未标注（不等于跨年龄）；抽不出写 待定。
  - name: 场景
    type: enum
    required: true
    group: 抽取类
    multi: true
    enum_ref: 场景
    description: 从正文实查抽取；一页命中多个场景时多值；均不贴合时记 其他。
  - name: 适用条件
    type: text
    required: true
    group: 抽取类
    multi: true
    item_format: 条件原文改写｜出处：文件名.md L<行号>「原句前 20 字」
    item_separator: ";;"
    description: >-
      读者在什么条件下适用本页做法；每条必带正文出处。多条用 ";;" 分隔；抽不出整条写 待定，并登记待定清单。
  - name: 不适用条件
    type: text
    required: true
    group: 抽取类
    multi: true
    item_format: 条件原文改写｜出处：文件名.md L<行号>「原句前 20 字」
    item_separator: ";;"
    description: >-
      什么情况下本页做法不适用、需转介或换做法；每条必带正文出处。正文整节缺漏的，
      登记"正文缺不适用条件页清单"，单元格写 待定。
  - name: 核心动作数
    type: integer
    required: true
    group: 派生类
    multi: false
    enum: null
    description: >-
      计数口径：以"今天能做的 N 件事"节的顶层编号条目为准；该节缺失时，
      以"具体怎么做"节的顶层动作条目计数；只数顶层条目，不数表格行与子步骤。
  - name: 含可照念话术
    type: enum
    required: true
    group: 派生类
    multi: false
    enum: [是, 否]
    description: >-
      正文是否存在带引号、可整段复制给他人（老师 / 孩子 / 伴侣 / 医生）的固定话术块；
      不论是否标注"照念"二字。无任何可复制台词 / 话术块记 否。
  - name: 含反例
    type: enum
    required: true
    group: 派生类
    multi: false
    enum: [是, 否]
    description: 正文是否含误区对照、反例对照表、"不要这样说 / 不要这样做"式纠错条目；有记 是，无记 否。
  - name: 关联页
    type: list
    required: false
    group: 派生类
    multi: true
    item_separator: ";"
    description: >-
      收集正文内实质交叉链接（行内链接 + "下一条可操作建议"清单）的目标编号；
      A00 首页导航链的链式罗列不计入。metadata 内对称：A 列 B 则 B 必列 A；
      正文单向链接不改正文，记入差异清单"正文单向关联"。
  - name: 高风险标记
    type: enum
    required: true
    group: 高风险判定
    multi: false
    enum_ref: 高风险标记
    description: 单选，命中多类时按优先级取最严；次要标签不丢，记入补标说明"多属性页清单"。
  - name: 最后审核
    type: date(YYYY-MM-DD)
    required: true
    group: 转录类
    source_column: 最后审核
    multi: false
    enum: null
    description: 原样转录状态表"最后审核"列日期。
  - name: 面向_次位
    type: enum
    required: false
    group: 转录类
    multi: false
    enum_ref: 面向
    description: 状态表双端写法的次位读者；无双端读者记 无。
  - name: 关联依据
    type: text
    required: false
    group: 派生类
    multi: true
    item_format: 目标编号=文件名.md L<行号>「锚文本前 15 字」
    item_separator: ";"
    description: 与 关联页 逐条一一对应、顺序一致；每条关联边必带正文行号依据；无关联页记 无。

enums:
  面向:
    multi: false
    values: [本人, 父母, 伴侣, 教师, B端, 临床, 全部]
    rules:
      本人: 状态表目标用户为"本人"，页面读者是 ADHD 成人自己。
      父母: 状态表目标用户为"父母"，读者是孩子家长。
      伴侣: 状态表目标用户为"伴侣"，读者是成人患者的伴侣 / 同住家人。
      教师: 状态表目标用户为"教师"，读者是学校教师。
      B端: 状态表目标用户为"专业人员"，映射为本库 B 端工作手册读者。
      临床: 状态表目标用户为"临床审核"，映射为临床边界参考读者。
      全部: 面向所有读者，用于全库入口页 / 跨角色边界声明页；不指向单一读者角色。
  页型:
    multi: false
    values: [解释页, 可操作页, 案例页, 模板页, 边界声明页]
    recognition_priority: [案例页, 模板页, 边界声明页, 解释页, 可操作页]
    rules:
      案例页: 文首有"本页人物与情节为教学虚构……"标注，或元数据证据状态为"虚构教学案例"，或正文含示范对话脚本 / 情景叙事段；读者主要动作是照着练这段话。
      模板页: 含至少一张可打印 / 可照抄的填空式表格或话术清单，字段带"例：……"示例；读者主要动作是填这张表 / 抄这段话。
      边界声明页: 主要目的是说清这件事能做到什么、不能做到什么、下一步找谁；通常无填空表、无脚本。
      解释页: 主要目的是把"为什么会这样 / 机制是什么"讲清楚；不承诺行动，通常无填空表、无脚本。
      可操作页: 不属于以上四类；读者主要动作是照页面列出的步骤 / 调整去执行。
    mixed_rule: 一页同时含模板与案例时，按读者读完后的主体动作判定（填表→模板页；练对话→案例页），判定依据写入补标说明。
  年龄段:
    multi: true
    values: [学前, 学龄, 青春期, 成人, 跨年龄, 未标注]
    rules:
      学前: 正文出现"幼儿园 / 学前 / 学龄前"等表述，或场景为幼儿园、家中低龄儿童。
      学龄: 正文出现"小学 / 课堂 / 课间 / 作业"等表述，或场景为在校学习。
      青春期: 正文出现"青春期 / 初中 / 高中 / 青少年"等表述。
      成人: 正文出现"成年 / 职场 / 自我评估"等表述，或读者为成人患者本人 / 伴侣视角下的成人。
      跨年龄: 正文同时覆盖两档及以上年龄段。
      未标注: 正文未给学段信息，属信息缺失；不等于跨年龄（跨年龄指正文同时覆盖两档及以上）。
  场景:
    multi: true
    values: [作业, 早晨, 睡前, 学校, 家庭冲突, 社交, 就诊, 职场, 其他]
    rules:
      作业: 作业时段、写作业 / 交作业相关动作。
      早晨: 起床、出门、早晨流程相关动作。
      睡前: 晚间入睡流程、睡前磨蹭相关动作。
      学校: 课堂、课间、家校沟通、幼儿园 / 学校作息等校内场景。
      家庭冲突: 亲子冲突、伴侣争吵、管教口径不一致等家庭内矛盾场景。
      社交: 同伴关系、朋友相处、社交尴尬等场景。
      就诊: 评估、面诊、准备就诊材料、转介评估等场景。
      职场: 成人工作场所、任务管理、同事协作场景。
      其他: 以上均不贴合的生活场景（如白天午休、外出购物等）。
  高风险标记:
    multi: false
    values: [安全事件, 高敏感叙事, 疗效暗示风险, 无]
    priority: [安全事件, 高敏感叙事, 疗效暗示风险, 无]
    rules:
      安全事件: 正文出现自伤 / 伤人、欺凌、推搡抢夺、勒索、失踪、遭受侵害等需校方或专业机构介入的事件描述，或页面给出安全事件转介动作。
      高敏感叙事: 涉及情绪障碍、自杀念头、家暴、性侵、死亡、被孤立 / 霸凌等易引发情绪卷入的叙事；虚构教学案例中的同类情境同计。
      疗效暗示风险: 出现"做了就会好 / 社交圈打开 / 长大就好"式因果或疗效承诺，或越出零用药合规的表述倾向。
      无: 以上三类均未命中。

separators:
  多值枚举列: "半角分号 ;，分号两侧不加空格；适用列：年龄段, 场景, 关联页。"
  条件单元格多条: "双半角分号 ;;；适用列：适用条件, 不适用条件。"
  条件条目格式: "条件原文改写｜出处：文件名.md L<行号>「原句前 20 字」；行号按 Get-Content 行计数。"

hard_rules:
  - id: HR1
    rule: 高风险标记单选；同一页命中多类时按 安全事件 > 高敏感叙事 > 疗效暗示风险 > 无 取最严；次要标签不丢，写入补标说明"多属性页清单"。
  - id: HR2
    rule: 主表每条关联边必有正文行号依据（关联依据列与关联页逐条对应）；无依据边不进主表，记入待核验关联清单。本轮不要求 metadata 内双向对称；正文单向链接不改正文，记入差异清单"正文单向关联"。
  - id: HR3
    rule: 转录类字段以状态表为准；与正文矛盾时不按正文改写，矛盾记入补标说明差异记录。
  - id: HR4
    rule: 抽取不出的字段写 待定；待定项必须在补标说明"待定清单"登记编号 / 字段 / 缺什么 / 为什么抽不出。
