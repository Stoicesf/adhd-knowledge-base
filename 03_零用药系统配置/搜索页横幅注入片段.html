  改词表时两处同步：本片段内联数组 与 药物关键词表.json 必须一致（重新运行生成脚本即可）。

<script>
(function () {
  'use strict';
  /* === KEYWORDS-START === */
var MED_KEYWORDS = ["药", "葯", "吃药", "喫藥", "喫药", "吃藥", "服药", "用药", "用藥", "服藥", "药物", "藥物", "ADHD药物", "ADHD药", "剂量", "劑量", "用量", "副作用", "藥物副作用", "不良反应", "不良反應", "哌甲酯", "哌甲脂", "哌甲酯类", "托莫西汀", "托莫西丁", "托莫西汀类", "专注达", "專注達", "择思达", "擇思達", "兴奋剂", "興奮劑", "兴奋剂类", "非兴奋剂", "非興奮劑", "非兴奋剂类", "停药", "停藥", "停药后", "减量", "減量", "加量", "换药", "換藥", "换别的药", "漏服", "忘吃药", "忘服药", "过量", "過量", "吃多了", "吃过量", "药物选择", "藥物選擇", "选药", "选哪种药", "要不要吃药", "要不要喫藥", "需不需要吃药", "要吃药吗", "利他林", "利他靈", "阿德拉", "阿得拉", "Adderall", "盐酸哌甲酯", "鹽酸哌甲酯", "盐酸哌甲脂", "胍法辛", "胍法辛缓释", "可乐定", "可樂定", "氯压定", "缓释片", "緩釋片", "缓释", "控释片", "控釋片", "控释", "mg", "毫克", "滴定", "滴定加量", "药量", "藥量", "药的量", "开药", "開藥", "医生开药", "处方药", "處方藥", "处方藥", "药物副作用", "药物副反应", "不良反应处理", "不良反應處理", "副作用处理", "能不吃药吗", "能不喫藥嗎", "可以不吃药吗", "必须吃药吗", "必須喫藥嗎", "一定要吃药吗", "用药多久", "用藥多久", "吃药多久", "吃多久药", "停药反应", "停藥反應", "停药后反应"];
/* === KEYWORDS-END === */
  var BANNER_TEXT = "本知识库不提供用药建议。药物相关决定由具备处方权的医生在评估后做出。";
  var TARGET_URL = "https://wiki.example.org/books/public-kb/page/medication-boundary";

  function norm(s) {
    return String(s || '').toLowerCase().replace(/\s+/g, '');
  }
  var HAYSTACK = MED_KEYWORDS.map(norm);

  function currentQuery() {
    var u = new URL(window.location.href);
    var q = u.searchParams.get('q') || u.searchParams.get('search') || '';
    if (!q && u.pathname.indexOf('/search') === -1) return '';
    return q;
  }
  function hit(q) {
    var n = norm(q);
    if (!n) return false;
    return HAYSTACK.some(function (k) { return k && n.indexOf(k) !== -1; });
  }
  function showBanner() {
    if (document.getElementById('med-boundary-banner')) return;
    var box = document.createElement('div');
    box.id = 'med-boundary-banner';
    box.className = 'med-boundary-banner';
    box.innerHTML =
      '<span class="med-banner-close" title="关闭">&times;</span>' +
      '<span class="med-banner-msg">' + BANNER_TEXT + '</span>' +
      ' <a class="med-banner-link" href="' + TARGET_URL + '">查看本库边界说明 &rarr;</a>';
    var anchor = document.querySelector('.search-results') ||
                 document.querySelector('#search-results') ||
                 document.querySelector('.content-list') ||
                 document.querySelector('main .container') ||
                 document.querySelector('main') || document.body;
    anchor.insertBefore(box, anchor.firstChild);
    box.querySelector('.med-banner-close').addEventListener('click', function () {
      box.parentNode && box.parentNode.removeChild(box);
    });
  }
  function maybe() { if (hit(currentQuery())) showBanner(); }
  document.addEventListener('DOMContentLoaded', maybe);
  window.addEventListener('popstate', function () {
    var b = document.getElementById('med-boundary-banner');
    if (b) { b.parentNode && b.parentNode.removeChild(b); }
    setTimeout(maybe, 300);
  });
})();
</script>
<style>
  .med-boundary-banner {
    box-sizing: border-box;
    width: 100%;
    margin: 0 0 12px 0;
    padding: 10px 36px 10px 14px;
    background: #fff7e6;
    border: 1px solid #f0c36d;
    border-radius: 6px;
    color: #6b4e00;
    font-size: 14px;
    line-height: 1.5;
    position: relative;
    overflow-wrap: break-word;
    word-break: break-word;
  }
  .med-boundary-banner .med-banner-close {
    position: absolute; top: 6px; right: 10px;
    cursor: pointer; font-size: 18px; color: #999; line-height: 1;
  }
  .med-boundary-banner .med-banner-link { color: #b35900; font-weight: 600; white-space: nowrap; }
</style>
