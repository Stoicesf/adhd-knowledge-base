# =====================================================================
# Agent Manifest  v1.0  (阶段六 · P2 蓝图在此冻结状态机定义)
# ---------------------------------------------------------------------
# 共享状态机：家长端视图与儿童端视图从「同一状态快照」渲染，只展示内容不同。
# 角色分离不在 prompt 层实现，而在同一状态上的两个呈现视图。
# 本文件为 P2 路由逻辑的输入契约；P0/P1 仅冻结状态 schema 与路由优先级骨架。
# =====================================================================

state_schema:
  task_phase:   [启动, 理解, 计划, 执行, 检查, 微休息]
  wm_load:      integer          # 当前需同时保持的信息单元数
  attention_state: [on-task, drift, re-entry]
  affect:       [neutral, frustration, escalation-risk]
  ownership:    [child-leading, parent-hinting, parent-taking-over]

# 路由优先级（硬编码，不允许各调用点自行决定）
routing:
  - order: 1
    name: skill_first
    rule: >
      先查 skill registry：当前状态是否命中某条 callable 条目的 trigger_condition。
      命中 → skill 为主，该微步骤内注入通道静默
      （仅允许 audience=both 的边界解释通过）。
  - order: 2
    name: retrieval_fallback
    rule: >
      未命中 skill → 走检索通道：结构化谓词过滤 → 向量检索 → 返回短块。
  - order: 3
    name: explicit_no_scaffold
    rule: >
      两者均未命中 → 显式「无支架」状态。
      不允许 LLM 自由生成辅导策略（ADHD 场景安全底线：防过度支持）。

# 辅导场景白名单（PROP-0006 / 阶段 B 批次 6-E，2026-11-14）
# ---------------------------------------------------------------------
# router.route(scenario=None) 原语义是「不按场景收窄」，会把非辅导场景
# （parent_escalation 家长火气急救）串进辅导检索——批次 6D 审计实测
# 注入 11 条其中 pc_* = 2。本键把 None 的语义收窄为「只查辅导场景」；
# scenario 非 None 时仍是精确匹配，行为不变。
# 注意：这是【顶层】键，不是 routing 的子键——routing 是有序 list
# （order 1/2/3 优先级），挂子键会破坏结构，故并列放置。
# 值必须等于 schema/entry.yaml::fields.scenario.values 减
# parent_escalation；由 router_tests E1 断言锁定，防两处定义漂移。
# transition 当前无 chunk 使用，属场景预留。
coaching_scenarios:
  - task_initiation
  - attention_drift
  - frustration_escalation
  - wm_overload
  - transition

# 支架强度（v1.1 / 2026-11-13，用户裁决 D2 走「降级」语义）
# 这是 skill 产物的字段，不新增状态机字段、不改变 routing 三态。
# 降级条件写在源条目 when / exit_when 里，router 只做通用透传，不另写条件。
scaffold_levels:
  full: "正常支架：给出下一步动作与可说的话"
  light: "降级支架：re-entry 中间态只给完成信号，不补讲、不追加新指令；稳定后按 exit_when 撤除"
  default: full

# 双视图渲染（共享状态上的两个呈现）
views:
  child_view:
    shows: ["当前可以点的下一步", "完成信号"]
    must_not_show: ["audience=parent 的条目"]
  parent_view:
    shows: ["当前建议你说的一句话", "不要说的话"]
    must_not_show: ["audience=child 的条目"]

# 安全底线（与 09_检索层/检索层策略_v1.md 七块一致，部署后由 guardrail 节点执行）
safety:
  guardrail_node: "05_审核与运营/guardrail_rules.yaml"
  forced_routes:
    medication_query: A06          # 零用药兜底：强制优先召回 A06
    safety_event:    [B37, C03]    # 安全事件必须路由 B37/C03
  block_rules:
    - "不得越过 A06 边界"
    - "不得把经验性策略说成指南推荐"
    - "不得出现神经多样性贬损语言"
