# =====================================================================
# 谓词模板库  predicate_templates.yaml  v1.2
# ---------------------------------------------------------------------
# 新条目的 when 优先从这里套用；覆盖不到时允许手写 when，但必须填
# deviation 字段（见模板扩展提案流程）。
#
# 两层参数语义（2026-11-13 明确，解决「params 全必填」误判 10/11 的问题）：
#   - params           可调参数：派生条目若出现该字段，不算「字段补充」偏离；
#                      条件性参数（consecutive_failures / wm_load）允许缺席。
#   - required_params  必填护栏：派生条目的 when 必须显式出现，缺失即判失败
#                      （template_conformance 编译前硬闸）。required_params
#                      是 params 的子集，语义约束更强；ownership 属此类。
# 回填脚本读 params 排除字段补充；template_conformance 读 required_params
# 做必填硬校验。两者职责分离，不互相干扰。
#
# applies_to 决定 template_conformance 的校验口径：
#   - 解释性条目（无 exit_when）的 template_ref 必须指向 applies_to 含
#     explanatory 的 PT_*；
#   - exit_when 校验对解释性条目「不适用」，单列 exit_not_applicable。
#
# PROP-0002（2026-11-13，A 类 full 审批通过）：ownership 在 PT_DRIFT_01 /
# PT_WM_01 中改为可调 param，从 when 移除，派生时按角色显式填值。
# diff_mode：状态点 1152 → 1728（+576，scope_change=widened）——模板级默认
# 角色约束解除，触发范围含 parent-taking-over；角色护栏改由 required_params
# 必填硬校验兜住（本轮已实装，known_risk 关闭）。
#
# 库内待统一（挂账，条件见 PROP-0002.followup）：PT_INITIATION_01 /
# PT_FRUSTRATION_01 的 when 仍保留 ownership 默认值，与另三个模板不同；
# 该差异只影响模板级状态空间与交叉校验，不影响条目级护栏（5/5 原模板的
# required_params 均已统一为 [ownership]）。
#
# v1.2（2026-11-13，阶段 B 批次 3 · PROP-0005）：新增第 6 个模板
# PT_PARENT_ESCALATION_01，是**唯一**使用 required_params 显式豁免的模板。
# 家长自救不是辅导过程，ownership（孩子主导 / 家长提示 / 家长接管）语义
# 不适用，硬塞会制造无意义谓词；豁免理由由 2.5c 的 _required_gate() 硬校验。
# 该模板 scenario=parent_escalation 与辅导状态机隔离（PROP-0005）。
# ⚠ params_exempt 计数口径：template_conformance.run() 按**条目**累加，
#   N 条引用本模板 → params_exempt=N；本文件的「豁免模板种类」恒为 1。
#   两者不可混用（PROP-0004 approval_record D-01 已如实留痕）。
# =====================================================================

# ---------------------------------------------------------------------
# 模板字段契约（阶段 A · 2.5c，2026-11-13）：机器可读，由
# template_conformance.py 直接读取，不只是注释说明。
#
# exempt_reason 是目前唯一允许的选填豁免字段：
#   - 仅当模板的 required_params 为空列表时，才必须配 exempt_reason；
#   - 理由长度须 > exempt_reason_min_length 字；
#   - 空列表 + 无理由 / 短理由 / 契约未声明该字段 → 一律判失败，
#     杜绝「把 required_params 删空就能静默绕过角色护栏」。
#
# 5 个原模板 required_params 均为 [ownership]，不用也不该用该字段；
# PT_PARENT_ESCALATION_01 是唯一使用者（v1.2 已实装）。
# ---------------------------------------------------------------------
template_fields_contract:
  optional_fields: [exempt_reason]
  exempt_reason_min_length: 20

templates:
  - id: PT_INITIATION_01
    scenario: task_initiation
    applies_to: [procedural, explanatory]
    when:
      task_phase: [启动]
      attention_state: [on-task]
      ownership: [child-leading]
    params: [wm_load, ownership]
    required_params: [ownership]

  - id: PT_DRIFT_01
    scenario: attention_drift
    applies_to: [procedural, explanatory]
    when:
      attention_state: [drift]
    # ownership → 可调 param（PROP-0002），从 when 移除，派生时按角色填值
    params: [consecutive_failures, ownership]
    required_params: [ownership]

  - id: PT_FRUSTRATION_01
    scenario: frustration_escalation
    applies_to: [procedural, explanatory]
    when:
      attention_state: [drift, re-entry]
      ownership: [child-leading, parent-hinting]
    params: [consecutive_failures, ownership]
    required_params: [ownership]

  - id: PT_WM_01
    scenario: wm_overload
    applies_to: [procedural, explanatory]
    when:
      attention_state: [drift, re-entry]
      wm_load: ">=2"
    # ownership → 可调 param（PROP-0002），从 when 移除，派生时按角色填值
    params: [wm_load, ownership]
    required_params: [ownership]

  - id: PT_TRANSITION_01
    scenario: transition
    applies_to: [procedural, explanatory]
    when:
      task_phase: [微休息, 检查]
    params: [ownership]
    required_params: [ownership]

  # ---- 阶段 B 批次 3（PROP-0004 + PROP-0005，full 审批同批落地）----
  # 家长自身情绪急救：运行期走 server.handle_parent_escalation() 旁路，
  # 不进 router.route() 辅导状态机。when 必须写成列表（op=in），
  # 因为 _common.eval_predicate 对裸字符串枚举值会 int(sv) 后恒为假。
  - id: PT_PARENT_ESCALATION_01
    scenario: parent_escalation
    applies_to: [explanatory]
    when:
      parent_affect_level: [low, mid, high]
    params: []
    required_params: []
    exempt_reason: "家长自救非辅导过程，ownership 语义不适用，豁免必填护栏"
