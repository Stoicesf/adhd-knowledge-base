# =====================================================================
# 扩展提案 PROP-0006（A 类 · full · 阶段 B 批次 6-E）
# ---------------------------------------------------------------------
# router 场景白名单：scenario=None 时只命中辅导场景，
# 关闭 6D 审计实测坐实的 parent_escalation 串扰入口。
# 需求证据 = 05_审核与运营/regression/批次6D_审计.md §Q2 / §残余边界
#   （6D 原文："若要根除，需给 router 加辅导场景白名单……另走提案"）。
# 预检数字来自 6E.1 实跑（E:/ANACONDA/python.exe），不是估算。
# 与方案字面口径不一致处逐条留痕在 literal_deviations，未改契约凑数字。
# =====================================================================

proposal_id: PROP-0006
type: A                    # 按 6-E 方案指定；类型语义偏差见 literal_deviations D-08
title: "router 辅导场景白名单：scenario=None 只命中 coaching_scenarios，关闭家长急救串扰入口"

requirement: >
  批次 6-D 审计 §Q2 清单外发现坐实：router.py:98-100 的 in_scope 是
  `rec.audience in allowed and (scenario is None or rec.scenario == scenario)`，
  没有辅导场景白名单。实跑 route(state, "parent", None, skills=[], chunks=…)
  在含 parent_affect_level=high 的状态下注入 11 条，其中 pc_* = 2
  （pc_escalation_refer_01 / pc_escalation_stop_01）+ fes_* = 3，
  即 scenario=None（合法入参，"查所有场景"语义）会把家长火气急救块
  串进辅导检索。当前不触发完全依赖调用方：25 条走 router 的既有轨迹
  都传具体辅导 scenario、server.py 硬编码 ("parent","parent_escalation",…)
  且不 import router、regression.py 有 entry_via 旁路守卫。
  这是"靠调用方守规矩"而非"router 自身保证"的隔离，任何新调用方
  合法传 None 即破防。6D 审计 §残余边界明确要求"另走提案"。

why_existing_insufficient: >
  三个近似方案逐一排除，故按流程 §六走 full 提案而非记偏离。
  ① 依赖调用方永远传具体 scenario：无法强制。router.route 的签名
     `scenario=None` 是合法默认值，router_tests 的 6912 个全状态穷举点
     与 4 个单例**本来就不传 scenario**，6D 只读探针也用 None 暴露行为；
     新调用方合法传 None 即串扰，靠约定不构成隔离保证。
  ② 用 audience 过滤兜住：实测 pc_escalation_* 6 条与 fes_* 7 条的
     audience 全部是 parent，在 parent 视图下同样进 allowed 集合，
     audience 硬过滤挡不住场景串扰。
  ③ 靠 server.py 不 import router / regression.py 的 entry_via 守卫：
     当前确实成立，但这是"旁路不复用 router"的架构选择，不是 router
     自身的隔离能力；将来若有第三条路径复用 router.route 就会直接撞上。
  ④ 曾考虑把白名单常量硬编码在 router.py 模块级、只在测试里比对：
     会形成 manifest 与代码两份事实来源，违背本项目反复强调的
     "同源契约 / 不写第二套条件"纪律（router ≡ build ≡ _common 的
     eval_predicate 单一对象就是同一原则），故改为从 agent_manifest.yaml
     单一来源延迟加载并缓存。
  结论：缺的是 router 自身对 scenario=None 的语义收窄，不是现行字段不够用。

proposal: >
  选 A 路径（场景白名单），不选 B（scenario 必填）—— B 是破坏性 API
  契约变更，且 scenario=None 表示"查所有场景"本身语义合理，只是不该
  把非辅导场景（当前为 parent_escalation）也包含进来。
  ① agent_manifest.yaml 新增【顶层】键
     `coaching_scenarios: [task_initiation, attention_drift,
     frustration_escalation, wm_overload, transition]`；
     routing 保持三态 list 原样（见 D-01）。值等于
     schema/entry.yaml::fields.scenario.values 减 parent_escalation。
  ② router.py：新增模块级 load_coaching_scenarios(manifest_path=…)，
     延迟 import yaml + 模块级缓存 frozenset；缺键/非字符串列表一律
     raise ValueError（fail loud，不静默回退到旧行为）。
     新增模块级 scenario_in_scope(rec_scenario, scenario, coaching)：
     scenario 非 None → 精确相等（行为完全不变）；
     scenario is None → 仅 rec_scenario in coaching。
     in_scope 由 route() 内闭包提为模块级函数
     `in_scope(rec, allowed, scenario, coaching_scenarios)`，
     内部调 scenario_in_scope；skill 分支的 passthrough 改用同一个
     scenario_in_scope，保证场景收窄只有一份实现（见 D-02/D-03）。
     route() 签名不变，内部读白名单并下传；不改 build.retrieve。
  ③ 语义不变项：scenario 非 None 的精确匹配、view→audience 角色护栏、
     路由三态优先级、eval_predicate 同源契约、产物与 manifest.sha256。

impact:
  predicate_equiv_state_space: >
    【实跑数字】predicate_equiv.run() = ok / 0 errors / checked = 248832
    （10368 状态点 × 24 条）；STATE_POINT_COUNT = 10368。
    本提案不改任何 when / 模板 / 源条目 / 状态维度，故 diff_mode
    **不适用**（它是模板级状态空间 diff），不为凑数硬跑一个 diff。
    验收时 confirm 该值恒为 248832。
  affected_entries: []       # 不改任何条目 frontmatter / 产物 / 哈希链
  affected_call_sites: >
    所有以 scenario=None 调用 router.route 的路径：router_tests 全状态
    穷举 6912 点 + 4 单例、6D 只读探针 (D)/(E) 组。因其状态不含
    parent_affect_level，pc_* 本就恒不命中，注入集实际不变（见 D-06）。
    显式传 scenario 的 25 条既有回归轨迹行为 100% 不变。
  scope_change: >
    scenario=None 的语义由"不按场景收窄"收窄为"只查辅导场景"；
    scenario 非 None 的路径 unchanged。这是本提案唯一的行为变更。

verification: >
  ① router_tests 增 3 条断言（checked 6917 → 6920），全部按可证伪设计：
     E1「None 白名单生效且可证伪」：状态显式带 parent_affect_level=high
        （此状态下改前实测串入 2 条 pc_* —— 预检已坐实；用默认 st()
        会因 pc_* 恒不命中而改前也绿，属假绿，见 D-05），断言注入集
        无 pc_*、等于独立重算的白名单并集（9 条）、且 manifest 白名单
        与 schema/entry.yaml 枚举减 parent_escalation 严格相等。
     E2「None 仍命中辅导场景 + passthrough 同款收窄」：断言仍命中 fes_*；
        直调 scenario_in_scope 验辅导场景 True / parent_escalation False；
        构造一条 audience=both & type=boundary & scenario=parent_escalation
        的探针块，在 skill 命中态下端到端验证其不被 passthrough 注入
        （改前会注入，可证伪）。
     E3「具体 scenario 行为不变」：对 5 个辅导 scenario 逐一独立重算
        精确注入集并与 route(sc) 比对；并断言
        route(..., "parent_escalation", skills=[]) 仍命中 2 条 pc_*
        —— 白名单只收窄 None，不得把家长急救的显式查询也堵死。
     额外断言合并进上述 3 条内部条件，不额外增加 checked 计数。
  ② route(scenario=None) 注入集与 6D 审计"串扰前"对比：pc_* 2 → 0。
  ③ verify_all 14/14 绿；断言 256148 → 256151（+3）；
     predicate_equiv 248832、24 chunks / 11 skills、conformance 46/46、
     test_server 15/15、test_api 21/21、test_static 42/42 全部不变。
  ④ 可证伪性独立复验：内存构造"删白名单/白名单含 parent_escalation"
     两种负例，三条断言应转红；真实源码绿、注释提及不误报。

rollback: >
  ① 从 agent_manifest.yaml 删除顶层 coaching_scenarios 键（routing list 未动）；
  ② router.py 恢复 in_scope 为 route() 内闭包
     `scenario is None or rec.scenario == scenario`、passthrough 恢复内联
     同式，删除 load_coaching_scenarios / scenario_in_scope 与模块级缓存，
     移除延迟 yaml import；
  ③ router_tests.py 删除 E1/E2/E3 三条断言；
  ④ 既有 25 条轨迹、24 条源条目、双产物、manifest.sha256 全程未动，
     原位回退即可，无需重编译。

approval_tier: full        # full（不降级）

status: approved

approval_record:
  date: "2026-11-14"
  tier: full
  channel: >
    用户 2026-11-14「批次 6-E：router 场景白名单 · 执行方案」明确
    「选 A」「按提案模板六项必填，新建 PROP-0006」「status: approved」，
    并要求 approval_record 引用 6D 审计实测数字作为需求证据；方案末尾
    「现在开工 6E.1：写 PROP-0006 提案，提案落盘后进 6E.2 实现」为
    连续授权（参照 PROP-0003/0004 先例，用户放行本批次的授权覆盖
    single 人工审，提案落盘即视为通过，不再另设等待点）。
    自动化预检（状态空间 248832、改前注入基线、断言假绿排查）已实跑。
  decision: >
    采纳 A 路径。scenario=None 是合法入参，白名单只收窄其语义、
    不改签名、不动显式 scenario 路径，风险可控；6D 审计已把该入口
    从"推断"升级为"实测可复现"，根除条件具备。
  measured_evidence:
    source_6d_audit: "05_审核与运营/regression/批次6D_审计.md §Q2 / §残余边界"
    scenario_none_injected_total: 11
    scenario_none_pc_hits: 2
    scenario_none_pc_ids: [pc_escalation_refer_01, pc_escalation_stop_01]
    scenario_none_fes_hits: 3
    predicate_equiv_checked: 248832
    state_point_count: 10368
    router_tests_checked_before: 6917
    verify_all_assertions_before: 256148
    golden_trajectories_via_router: 25
    golden_trajectories_with_none_scenario: 0
    probe: "6E.1 只读预检（内联实跑，未落盘）；断言假绿风险一并坐实"

  # ---- 与方案字面口径不一致的九处差异，逐条如实留痕 ----
  literal_deviations:
    - id: D-01
      item: "agent_manifest.yaml 增 routing.coaching_scenarios"
      fact: >
        routing 是 3 元素 list（- order: 1/2/3），不是 dict，挂子键会
        破坏结构。改为顶层 coaching_scenarios 键，routing 三态原样不动。
    - id: D-02
      item: "in_scope(rec, audience, scenario, coaching_scenarios) 一行逻辑"
      fact: >
        实际 in_scope 是 route() 内闭包，捕获 allowed 集合而非 audience
        字符串，且被 skill 分支与检索分支两处调用。按方案提为模块级
        函数并显式传参，另抽 scenario_in_scope() 作场景判定唯一实现。
    - id: D-03
      item: "只改 in_scope 一处"
      fact: >
        router.py:126 的 passthrough 有同款 `scenario is None or …` 未收窄，
        属同一 bug 第二入口。当前 audience=both && type=boundary 的块
        实测为 0 故不可达，但仍一并收窄并用构造块端到端断言覆盖。
    - id: D-04
      item: "route() 从 manifest 读取并传入"
      fact: >
        router.py 原本完全不读 manifest（只读两个 json 产物）。实现为
        模块级延迟加载 + frozenset 缓存（route() 每次只查内存，无逐次
        IO）；缺键 raise ValueError fail loud，不静默回退旧行为。
    - id: D-05
      item: "断言 1 用 route(state, 'parent', None, skills=[], chunks=chunks)"
      fact: >
        router_tests.st() 默认状态不含 parent_affect_level，pc_* 的 when
        恒不命中（实测 None 注入 4 条、pc_*=0），该断言改前亦绿 = 假绿。
        断言状态必须显式带 parent_affect_level=high（改前 2 条 / 改后 0 条）。
    - id: D-06
      item: "既有 25 条轨迹全传具体 scenario，行为不变"
      fact: >
        对 25 条轨迹成立。但 router_tests 的 6912 个全状态穷举点与 4 个
        单例本来就传 scenario=None；因其状态无 parent_affect_level，
        pc_* 本就不命中，穷举注入集实际不变——原因是状态字段，不是白名单。
    - id: D-07
      item: "diff_mode 不受影响"
      fact: >
        结论正确，但 diff_mode 是模板级状态空间 diff，本提案不动模板/
        谓词/条目，**不适用**；实跑 predicate_equiv.run() = 248832 恒定，
        不为凑数硬造一个 diff 数字。
    - id: D-08
      item: "type: A（改 router 行为，影响 in_scope 语义）"
      fact: >
        流程 §一 定义 A = 新谓词字段（进 when 白名单）、B = 新场景类型，
        本提案是路由行为变更，不属 5 类定义域。按方案写 A/full
        （full 分级合理，不降级），此处明确标注类型语义偏差，
        不冒充标准 A 类。
    - id: D-09
      item: "coaching_scenarios 五个场景值"
      fact: >
        与 schema/entry.yaml::fields.scenario.values 减 parent_escalation
        完全一致；其中 transition 当前 0 个 chunk 使用，属预留。
        manifest 与 schema 形成两份来源，故 E1 加断言锁定二者严格相等。

known_risk: >
  ① scenario=None 的语义变化是真实行为变更：任何将来依赖"None 查全部
    场景（含非辅导）"的调用方会静默少拿块，需在集成时确认；当前 25 条
    轨迹与 server 旁路均不受影响。
  ② 新增辅导场景类型时须同步 agent_manifest.yaml::coaching_scenarios
    与 schema/entry.yaml::scenario.values，否则 E1 的一致性断言转红
    （刻意设计成 fail loud，不做自动推导以免掩盖漏改）。
  ③ router.py 新增对 PyYAML 的延迟依赖；该依赖已由
    03_agent编译/requirements.txt 提供（schema_check 等在用），
    不是新引入的第三方包，但 router 此前不依赖它，如实记录。
  ④ 6D 只读探针 data/_batch6D_audit.py 的 (D)/(E) 组复跑时
    scenario=None 的 pc_* 数字会由 2 变 0——这正是修复效果；
    该探针与 6D 审计 md 记录的是改前基线，按 append-only 不回写。
  ⑤ 家长工具与辅导端将来集成（家长火气 + 孩子状态同时入参）仍是
    独立 API 契约变更，不属本提案范围。

