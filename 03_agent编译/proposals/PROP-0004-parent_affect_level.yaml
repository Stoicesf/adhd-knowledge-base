verification: >
  ① 新增 03_agent编译/validators/parent_escalation_tests.py 作为
     verify_all 第 14 组，显式断言「新条目 when 字段在 entry.yaml 白名单内」
     —— 因为 schema_check.py 只校验顶层枚举，不检查嵌套
     when.allowed_fields，光改 entry.yaml 不会自动保证字段合法；
  ② 断言新条目 inject_text 按「。」切分后每句都是现有 18 条
     inject_text 的逐字子串（不编造可证伪）；
  ③ 断言 parent_affect_level 写成列表（无裸字符串 ==）；
  ④ 断言既有 18 条条目谓词在 10368 点上触发范围 unchanged；
  ⑤ verify_all 由 13/13 升 14/14 组绿。

rollback: >
  从 schema/entry.yaml 的 when.allowed_fields / field_enums 移除
  parent_affect_level 并回退到 v1.1；删除 02_内容包/书籍F_家长急救/
  下引用该字段的条目、对应 golden_trajectories 记录与
  parent_escalation_tests 组；重跑 build.py 刷新产物与 manifest。
  既有 18 条、5 个原 PT_* 模板、25 条既有轨迹不受影响，可原位回退。

