known_risk: >
  与 affect 并列，文档明确区分孩子情绪 vs 家长火气（已写入 entry.yaml
  when.note）。另有一处语义边界须挂账：现有 18 条全部是学科辅导支架
  （面向孩子作业过程），没有家长火气急救的原生文案；本批次派生条目
  只做「逐字摘句重组 + 场景标签」，不构成家长火气 1—5 分档内容。
  分档话术、五类身体预警表、修复话术、免责声明原文均需等 parent-cool
  原文到位后补齐，当前按不编造纪律保留占位。
