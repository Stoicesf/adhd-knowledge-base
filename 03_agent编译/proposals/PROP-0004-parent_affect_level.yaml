proposal_id: PROP-0004
type: A                    # A 新谓词字段（进 when 白名单）→ full
title: "parent_affect_level 进 when 白名单，枚举 [low, mid, high]（家长火气维度）"

requirement: >
  阶段 B 的 parent-cool 家长急救链路按 09_家长端工具/parent_cool_clone/
  server/server.py 的 ANGER_TIER 把入参火气 1—5 映射为 low/mid/high，
  再以 build.retrieve("parent", "parent_escalation",
  {"parent_affect_level": level}) 做结构化谓词过滤。但 schema/entry.yaml
  v1.1 的 when.allowed_fields 只有 task_phase / attention_state /
  ownership / wm_load / consecutive_failures 五个辅导状态字段，
  没有任何描述「家长自身情绪」的维度，新场景条目无法写出合法谓词。

why_existing_insufficient: >
  三个现有近似方案逐一试过，均失败，故按流程 §六走 A 类提案而非记偏离。
  ① 用 affect 字段近似（router.py __main__ 默认 state 含
     "affect": "neutral"）：affect 描述的是孩子情绪，与家长火气是不同主体；
     更关键的是 predicate_equiv.iter_states() 的状态空间根本没有 affect
     维度，写进 when 会在全部 10368 个状态点上因「字段不在 state」恒为假，
     条目永远检索不到，属假合规。
  ② 用 attention_state / consecutive_failures 等辅导状态做代理：这些字段
     描述的是孩子作业过程（走神、连续失败次数），家长火气升高时孩子可能
     仍在 on-task 且零失败，代理条件会在最需要急救的场景下漏触发；反过来
     孩子一走神就误触发家长自救话术，与 B32↔B44 角色护栏的设计意图相冲突。
  ③ 不进 schema，改由服务层直接按 anger_level 查静态表返回话术：这等于
     绕过编译管线的结构化谓词过滤，条目与产物（chunks.jsonl）不再同源，
     也绕开了 predicate_equiv 的双通道等价断言与 router 的同源契约，
     会重新制造「两套条件漂移」。
  结论：缺的是「家长自身情绪」这一独立状态维度，不是模板存在但不够。
  同时该维度已在阶段 A · 2.5b 就位（PARENT_AFFECT=[low,mid,high]、
  iter_states() 已含该字段），本提案只是把求值侧与声明侧对齐。

proposal: >
  schema/entry.yaml 由 v1.1 升 v1.2：
  ① when.allowed_fields 增 parent_affect_level；
  ② when.field_enums 增 parent_affect_level: [low, mid, high]；
  ③ when.note 明确「affect（孩子情绪，文档层）与 parent_affect_level
     （家长火气，求值层）是不同主体，不得互相代替」；
  ④ meta.changelog 增一条。
  求值实现不改：_common.compile_predicate / eval_predicate 与
  predicate_equiv.iter_states() 在阶段 A 已支持该字段，本提案不新增
  第三套条件判断，router ≡ build ≡ _common 同源契约保持成立。
  新增条目的 when 必须写成列表（如 [low] 或 [low, mid, high]），
  因为 eval_predicate 对非 in 比较会 int(sv)，裸字符串 "low" 会恒为假。

