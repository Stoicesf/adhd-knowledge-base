    predicate_equiv.run().checked：186624 → 248832（+6 条 × 10368 点）。
    产物：chunks.jsonl 18 → 24 块；skill_registry.json 恒 11 skills
    （新增条目全为 explanatory、无 callable，不产 skill）。
  affected_entries: []
  existing_entries_with_new_scenario: 0

verification: >
  ① verify_all 新增 parent_escalation_tests 组（第 14 组）：
     三档映射（ANGER_TIER 1—5 → low/mid/high 且覆盖 2/4 边界）、
     三档真实 retrieve 命中、guardrail block → blocked fallback、
     degraded 与 blocked 分开断言、条目 when 白名单断言、
     inject_text 逐字可溯断言；
  ② regression.py 的 entry_via 分支只作用于新轨迹，
     并内置「既有 25 条不得带 entry_via」的可证伪断言；
  ③ test_server.py 两条批次 2「预期 degraded=true」断言联动复核
     （条目派生后应转 degraded=false；另用 fake_retrieve 返回空的
     负例保留 degraded 分支覆盖）；
  ④ verify_all 14/14 组绿、主偏离率 0.0%、角色泄漏 0、
     既有 25 条 conformance 40/40 不变；
  ⑤ 偏离清单的「豁免模板」表出现 1 种模板 / N 条命中条目。

rollback: >
  从 scenario.values 移除 parent_escalation；删除
  PT_PARENT_ESCALATION_01 模板定义、parent_cool 接入卡、
  02_内容包/书籍F_家长急救/ 全部条目、6 条新轨迹、
  regression.py 的 entry_via 分支与 parent_escalation_tests 组；
  重跑 build.py 刷新产物与 manifest。既有 18 条、5 个原模板、
  25 条轨迹、11 个 skills 不受影响。

