# =====================================================================

proposal_id: PROP-0005
type: B                    # B 新场景类型 → full
title: "新增 scenario: parent_escalation 与 PT_PARENT_ESCALATION_01（家长情绪独立场景）"

requirement: >
  家长火气急救是独立于辅导状态机的场景：server.py 的
  handle_parent_escalation() 只调 build.retrieve + guardrail_node.judge，
  **不调 router.route()**。但 schema/entry.yaml v1.1 的 scenario 枚举只有
  task_initiation / attention_drift / frustration_escalation /
  wm_overload / transition 五个，全部描述孩子作业过程；router.in_scope()
  按 scenario 精确收窄，若把家长急救条目塞进既有枚举，会与辅导轨迹互相
  污染，也无法让 retrieve("parent","parent_escalation",...) 独立命中。

why_existing_insufficient: >
  三个现有近似方案逐一试过，均失败。
  ① 复用 frustration_escalation：该枚举在现有 5 条 fes_* 条目里明确指
     「按孩子状态 / 失败次数触发的辅导支架」（批次 0 盘点 note 逐字记录），
     主体是孩子挫败，不是家长火气。把家长自救话术挂进去后，
     build.retrieve 与 router.route 在 frustration_escalation 上会同时
     命中两类语义不同的条目，既有 7 条 fes_* 轨迹的 injected_contains
     断言会被污染，且分不清哪条是给谁的。
  ② 复用 attention_drift 或 wm_overload：这两个枚举属于学科辅导支架，
     家长火气升高时孩子可能完全 on-task、零负荷，谓词条件错配；
     并且 router.route 的 skill 优先级会先命中辅导 skill，把本该
     「家长先离开书桌」的急救话术静默掉。
  ③ 不进 scenario 枚举、只靠 audience=parent + 自定义 when 字段区分：
     scenario 是 schema_check 的顶层必填枚举，不填即编译失败；
     而 router.in_scope() 与 build.retrieve() 都以 scenario 做第一道
     结构化过滤，绕过它等于让家长急救条目在所有辅导场景里都可能命中。
  结论：这是模板库缺场景类型（流程 §六），不是模板存在但不够，
  必须提 B 类提案，不能靠记偏离消化。

proposal: >
  ① schema/entry.yaml 的 scenario.values 增 parent_escalation
     （与 PROP-0004 同批升 v1.2）；
  ② 03_agent编译/templates/predicate_templates.yaml 增：
       id: PT_PARENT_ESCALATION_01
       scenario: parent_escalation
       applies_to: [explanatory]
       when: {parent_affect_level: [low, mid, high]}
       params: []
       required_params: []
       exempt_reason: "家长自救非辅导过程，ownership 语义不适用，豁免必填护栏"
     豁免依据：阶段 A · 2.5c 的 _required_gate() 规定空 required_params
     绝不静默放行，必须配 template_fields_contract.optional_fields 里
     声明的 exempt_reason 且长度 > 20 字；本理由 30 字，过闸。
     ownership 描述「孩子主导 / 家长提示 / 家长接管」的辅导主导权归属，
     家长自救场景里没有辅导动作，硬塞会制造无意义谓词。
  ③ 派生 6 条解释性条目（无 callable、无 exit_when、只进 chunks.jsonl），
     全部 audience=parent / scenario=parent_escalation /
     template_ref=PT_PARENT_ESCALATION_01 / when 严格套模板零偏离，
     proposal_ref=PROP-0005（字段依据 PROP-0004 写在条目正文）。
  ④ regression.py 增 entry_via: "parent_escalation" 分支，
     golden_trajectories.jsonl 追加 6 条 conformance（现有 25 条行为不变）。

