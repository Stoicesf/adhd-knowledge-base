known_risk: >
  ① 新 6 条 when 三档全命中，但文件名排序靠后（pc_escalation_* < pc_repair /
     pc_warning），candidates[0] 仍为既有单档条目，三档 line 输出不变；
     未来若调整文件名或排序，EXPECTED_FIRST 断言会变红，强制走流程。
  ② 五类预警的「当场动作」列是通用动作逐字取自来源，非逐类一一对应
     （源本身无逐类动作映射）；已明确标注，不伪装成逐类对应。
  ③ 修复卡话术逐字取自 aiadhd 中文篇（商业科普站，证据等级 C），
     非临床指南；面向家长时以「参考话术」呈现，不声称医学权威。
