proposal_id: PROP-0007
type: B                    # 新增来源内容 → full
title: "修复卡 + 五类预警授权抓取来源接入（解除 6 个 pending_batch3 槽位）"

requirement: >
  阶段 B 批次 3 起，6 个静态槽位（repair_card_01 + warning_signs_呼吸/肌肉/
  声音/胸口/念头）因「原文不在手」按不编造纪律保留 pending_batch3 占位。
  批次 8 用户授权走 B 路线：抓取外部来源逐字落 00_来源治理/_staging/ 留
  SHA256，从中文来源逐字派生 6 条 explanatory 源条目，回填这 6 个槽位。

why_existing_insufficient: >
  批次 6-D 已对 24 条独立复核确认修复卡「无可派生文案」——不是模糊等内容，
  是已证伪（严格信号 0 命中，候选句方向与主动修复相反）。五类预警同理：
  现有 18 条全是学科辅导支架，无家长身体预警原生文案；fes_parent_* 里的
  「等他呼吸平了」指孩子，不可挪作家长预警。故必须引入外部来源，不能靠
  存量语料派生。

proposal: >
  ① 抓取 5 个外部来源逐字落 _staging/ 留 SHA256：
     - fhs_hk_anger_management（香港卫生署，中文，literature）
     - aiadhd_yell_repair（aiadhd 中文篇，literature）
     - nhs_inform_anger_control（NHS，英文，clinical_guideline）
     - pkjcoaching_pause_repair（英文，literature）
     - calmhome_3sentence_repair（英文，literature）
  ② 语言裁决：中文派生 + 英文留痕。中文来源（fhs / aiadhd）建接入卡并派生；
     英文来源（nhs / pkj / calmhome）合并为 1 张留痕参照卡
     （_reference_english_sources.yaml，下划线开头，source_intake_check 跳过），
     不进校验、不派生。
  ③ 写 derive_batch8_entries.py：从中文 staging 原文逐字摘句，生成 6 条
     explanatory 源条目（pc_repair_card_01 + pc_warning_{breath,muscle,voice,
     chest,thought}_01），scenario=parent_escalation、
     template_ref=PT_PARENT_ESCALATION_01、when 三档 [low,mid,high]、
     source_id 用新卡（非 parent_cool）、source_version="2026-11-15"。
  ④ 回填 copy_mapping.json：6 个 pending 槽位 → mapped，text 逐字取自
     新条目 inject_text（build_copy_mapping.py BATCH8_SLOT_MAP）。
  ⑤ 修正联动断言（有理由、可证伪，不凑绿）：
     - router_tests 6E E3：显式 parent_escalation 查询 pc_* 命中 2→8，
       期望值改为 _expect 独立重算（不硬编码）。
     - parent_escalation_tests ②：三档命中 2→8（既有 2 单档 + 新 6 三档），
       断言改为「既有单档仍在 + 总数 8」；params_exempt 6→12（按条目计数）。
     - test_static.js：pending 6→0、预警表/修复卡占位 → mapped 逐字。

