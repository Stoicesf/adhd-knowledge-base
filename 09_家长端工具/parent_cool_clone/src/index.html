<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>家长先稳住 · 家长端急救卡</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">

  <header class="head">
    <h1>家长先稳住</h1>
    <p class="sub">火气上来时，先看这一页。</p>
    <button id="theme-toggle" type="button" class="theme-btn" aria-label="切换显示模式">显示模式</button>
  </header>

  <!-- 1 呼吸区 -->
  <section id="sec-breathing" class="card">
    <h2>先呼吸 5 回合</h2>
    <p class="meta" id="breathing-spec"></p>
    <div class="breath-stage">
      <div id="breath-circle" class="breath-circle" aria-hidden="true"></div>
      <div id="breath-label" class="breath-label">准备</div>
    </div>
    <div class="row">
      <button id="breath-start" type="button" class="btn primary">开始</button>
      <span id="breath-progress" class="meta">0 / 5 回合</span>
    </div>
  </section>

  <!-- 2 话术卡 -->
  <section id="sec-scripts" class="card">
    <h2>话术卡</h2>
    <p class="meta" id="script-counter"></p>
    <div id="script-card" class="script-card" aria-live="polite"></div>
    <div class="row">
      <button id="script-prev" type="button" class="btn">上一张</button>
      <button id="script-next" type="button" class="btn">下一张</button>
    </div>
  </section>

  <!-- 3 AI 区 -->
  <section id="sec-ai" class="card">
    <h2>说一句能接住的话</h2>
    <label class="field">
      <span>现在火气值（1—5）</span>
      <select id="ai-anger"></select>
    </label>
    <label class="field">
      <span>刚才发生了什么（可不填）</span>
      <textarea id="ai-situation" rows="2" placeholder=""></textarea>
    </label>
    <div class="row">
      <button id="ai-submit" type="button" class="btn primary">给我一句话</button>
    </div>
    <div id="ai-status" class="meta" aria-live="polite"></div>
    <div id="ai-output" class="ai-output" aria-live="polite"></div>
  </section>

  <!-- 4 撤退方案 -->
  <section id="sec-retreat" class="card">
    <h2>三级撤退</h2>
    <div id="retreat-list"></div>
  </section>

  <!-- 5 预警表 -->
  <section id="sec-warning" class="card">
    <h2>身体预警表</h2>
    <div class="table-scroll">
      <table id="warning-table" class="grid"></table>
    </div>
  </section>

  <!-- 6 修复话术 -->
  <section id="sec-repair" class="card">
    <h2>发火之后，怎么开口</h2>
    <div id="repair-card" class="script-card"></div>
  </section>

  <!-- 7 日志 -->
  <section id="sec-log" class="card">
    <h2>记一笔</h2>
    <form id="log-form">
      <label class="field"><span>火气值（1—5）</span><select id="log-anger"></select></label>
      <label class="field"><span>触发场景</span><input id="log-trigger" type="text"></label>
      <label class="field check"><input id="log-lost" type="checkbox"><span>这次发火了吗</span></label>
      <label class="field"><span>备注</span><textarea id="log-note" rows="2"></textarea></label>
      <div class="row">
        <button type="submit" class="btn primary">保存</button>
        <button id="log-clear" type="button" class="btn">清空记录</button>
      </div>
    </form>
    <p id="log-count" class="meta"></p>
    <ol id="log-list" class="log-list"></ol>
  </section>

  <!-- 8 免责声明 -->
  <footer id="sec-disclaimer" class="disclaimer">
    <div id="disclaimer-text"></div>
  </footer>

</main>

<!-- 数据同源包装：由 build_copy_mapping.py 从 data/*.json 机械生成，file:// 可直接加载 -->
<script src="../data/features.js"></script>
<script src="../data/copy_mapping.js"></script>
<script src="core.js"></script>
<script src="api.js"></script>
<script src="app.js"></script>
</body>
</html>
