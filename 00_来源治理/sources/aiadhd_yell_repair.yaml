intake_notes: |
  阶段 B 批次 8 授权抓取（B 路线）接入，抓取日 2026-11-15。
  本卡为中文场景的补充逐字来源：
  - 身体信号：心跳加速、肌肉绷紧、声调开始提高。
  - 热念头：识别「他就是故意不尊重我」「我彻底失败了」这类
    灾难化色彩的自动念头。
  - 暂停语：「我现在感觉非常生气，我需要去另一个房间冷静两分钟，
    我们稍后再谈。」
  - 生理急救：用冷水冲洗手腕和脸部；或将手放在心脏位置做三次
    缓慢深长的腹式呼吸。
  - 修复话术（为行为而非情绪道歉）：「对不起，刚才妈妈/爸爸没有
    控制好自己的脾气，对你大吼大叫了。我感到很生气，但这不能成为
    我伤害你的理由。我爱你。」
