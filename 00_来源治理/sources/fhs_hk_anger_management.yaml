intake_notes: |
  阶段 B 批次 8 授权抓取（B 路线）接入，抓取日 2026-11-15。
  本卡为五类身体预警「常见信号」列与修复道歉话术的逐字来源：
  - 常见信号：心跳加速、呼吸短而浅、肌肉绷紧、手心出汗、胸闷；
    觉察环节补「面红耳热、声线提高」。
  - 灾难化念头：「天啊！我永远都教不好孩子！」（妄下判断另例
    「孩子打翻了饭，一定是因为他在跟我斗气」）。
  - 修复话术：「对不起，即使我很生气，我也不应该大声骂你的」。
